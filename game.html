<title>Ellie's Animal Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* One bright look on purpose: this is a kids' game, so it stays light in every theme. */
:root{
  --wall:#DDF3EE; --wall-tile:#CFEDE6; --floor:#9FD9CB;
  --ink:#1F3A48; --ink-soft:#4E6B78;
  --teal:#11807F; --teal-deep:#0B5E5E;
  --sun:#FFC53D; --sun-deep:#E3A413;
  --coral:#FF7563; --coral-deep:#D9503F;
  --lilac:#8F7CEB; --lilac-deep:#6C58C9;
  --card:#FFFFFF; --line:#B9DDD5;
  --good:#23A55E; --good-soft:#DDF6E7;
  --display:'Fredoka','Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;
  --read:'Andika','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0; background:var(--wall); color:var(--ink);
  font-family:var(--read); font-size:20px; line-height:1.35;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  background-image:
    linear-gradient(transparent calc(100% - 90px), var(--floor) calc(100% - 90px)),
    repeating-linear-gradient(0deg, transparent 0 58px, var(--wall-tile) 58px 60px),
    repeating-linear-gradient(90deg, transparent 0 58px, var(--wall-tile) 58px 60px);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--lilac);outline-offset:3px}
#app{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;box-sizing:border-box}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.sign{display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--teal);border-radius:18px;padding:6px 16px 6px 8px;font:700 24px/1 var(--display);color:var(--teal-deep);box-shadow:0 5px 0 var(--teal)}
.sign .ellie{margin-block:-4px}
/* Dr. Ellie's headshot */
.ellie{flex:none;border-radius:50%;background:var(--wall);border:3px solid #fff;box-shadow:0 0 0 3px var(--teal);object-fit:cover;display:block}
.ellie.hop{animation:hop .3s ease-in-out 4 alternate}
.ellie.tilt{animation:tilt .5s ease-in-out}
@keyframes tilt{30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
button.ellie-btn{border:none;background:none;padding:0;border-radius:50%}
.says{display:flex;align-items:center;gap:14px}
.bubble{position:relative;background:#EEF8F6;border:3px solid var(--line);border-radius:22px;padding:10px 18px;flex:1;min-width:0}
.bubble::before{content:'';position:absolute;left:-13px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:12px solid var(--line);border-left:0}
.bubble::after{content:'';position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:9px solid #EEF8F6;border-left:0}
.bar .spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--sun-deep);border-radius:999px;padding:6px 14px;font:700 22px/1 var(--display);box-shadow:0 4px 0 var(--sun-deep);font-variant-numeric:tabular-nums}
.iconbtn{min-width:56px;height:56px;border-radius:16px;border:3px solid var(--line);background:var(--card);font-size:28px;box-shadow:0 4px 0 var(--line);display:grid;place-items:center;padding:0 10px}
.iconbtn:active,.big:active,.choice:active,.tile:active,.coin:active,.arrow:active{transform:translateY(3px);box-shadow:none}

.screen{flex:1;display:flex;flex-direction:column;gap:16px;padding-block:8px 24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.big{border:none;border-radius:22px;padding:18px 34px;font:700 30px/1 var(--display);background:var(--coral);color:#fff;box-shadow:0 7px 0 var(--coral-deep);min-height:72px}
.big.teal{background:var(--teal);box-shadow:0 7px 0 var(--teal-deep)}
.big.sun{background:var(--sun);color:var(--ink);box-shadow:0 7px 0 var(--sun-deep)}
.big.small{font-size:24px;padding:12px 22px;min-height:60px}

/* ---------- pet (photo or stand-in) ---------- */
.pet{position:relative;width:var(--s,200px);height:var(--s,200px);max-width:100%;display:grid;place-items:center;flex:none}
.pet img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(20,60,60,.28))}
.pet .emo{font-size:calc(var(--s,200px)*.72);line-height:1;filter:drop-shadow(0 6px 4px rgba(20,60,60,.25))}
.pet.sick img,.pet.sick .emo{filter:saturate(.45) brightness(.97) drop-shadow(0 8px 6px rgba(20,60,60,.28));transform:rotate(-4deg)}
.pet.better img,.pet.better .emo{filter:saturate(.8) drop-shadow(0 8px 6px rgba(20,60,60,.28))}
.pet .ail{position:absolute;right:2%;bottom:6%;font-size:calc(var(--s,200px)*.24);animation:bob 1.6s ease-in-out infinite}
.pet.happy{animation:hop .7s ease-in-out infinite alternate}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes hop{to{transform:translateY(-18px)}}

/* ---------- title ---------- */
.title-wrap{flex:1;display:grid;place-items:center;text-align:center}
.title-card{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:720px}
.title-card h1{font-size:clamp(44px,8vw,84px);line-height:.95;color:var(--teal-deep)}
.title-card h1 span{color:var(--coral)}
.title-card p{font-size:24px;margin:0;color:var(--ink-soft)}
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:40px;align-items:center;max-width:1020px;padding-block:12px}
.hero .title-card{align-items:flex-start;text-align:left}
.poster{margin:0;transform:rotate(-2.5deg)}
.poster img{display:block;width:100%;height:auto;border-radius:26px;border:8px solid #fff;box-shadow:0 10px 0 var(--teal),0 18px 40px rgba(17,80,80,.18)}
@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:26px;justify-items:center}
  .hero .title-card{align-items:center;text-align:center}
  .poster{max-width:min(330px,80vw)}
}
.badge-doc{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:3px dashed var(--teal);border-radius:16px;padding:8px 18px;font:600 24px var(--display);color:var(--teal-deep)}
.linkbtn{background:none;border:none;color:var(--ink-soft);font:600 18px var(--display);text-decoration:underline;padding:12px}

/* ---------- waiting room ---------- */
.room-head{display:flex;flex-direction:column;gap:4px}
.room-head .says{margin-top:6px;max-width:640px}
.room-head .bubble p{margin:0;font-size:22px;color:var(--ink)}
.room-head h2{font-size:34px}
.room-head p{margin:0;color:var(--ink-soft)}
.benches{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.patient{background:var(--card);border:4px solid var(--line);border-radius:28px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 8px 0 var(--line)}
.patient h3{font-size:28px}
.patient .what{margin:0;color:var(--ink-soft);min-height:2.7em}
.patient .big{width:100%}

/* ---------- exam ---------- */
.exam{display:grid;grid-template-columns:minmax(260px,2fr) 3fr;gap:18px;align-items:start}
.table{background:var(--card);border:4px solid var(--teal);border-radius:30px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 8px 0 var(--teal)}
.mat{background:radial-gradient(ellipse at 50% 80%,#CDEFE7 0 55%,transparent 56%);width:100%;display:grid;place-items:center}
.nametag{font:700 28px var(--display);background:var(--sun);border-radius:12px;padding:4px 16px;box-shadow:0 4px 0 var(--sun-deep)}
.complaint{margin:0;text-align:center;color:var(--ink-soft)}
.hearts{font-size:34px;letter-spacing:4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%}
.steps li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:#F1F8F6;font-size:19px}
.steps li .tool{font-size:26px}
.steps li.now{background:#FFF3CF;outline:3px solid var(--sun)}
.steps li.done{background:var(--good-soft);color:#1B6B42}
.steps li.done::after{content:'✓';margin-left:auto;font:700 24px var(--display);color:var(--good)}

.task{background:var(--card);border:4px solid var(--line);border-radius:30px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 var(--line);min-height:420px}
.task-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:600 17px var(--display);padding:5px 12px;border-radius:999px;color:#fff;letter-spacing:.02em}
.chip.math{background:var(--sun-deep)}
.chip.lang{background:var(--lilac)}
.stepno{margin-left:auto;font:600 17px var(--display);color:var(--ink-soft)}
.prompt{display:flex;align-items:center;gap:12px}
.prompt .bubble p{margin:0;font-size:28px;font-weight:700;line-height:1.25}
.speak{flex:none;width:60px;height:60px;border-radius:50%;border:3px solid var(--lilac);background:#F1EEFF;font-size:28px;box-shadow:0 4px 0 var(--lilac)}
.work{display:flex;flex-direction:column;align-items:center;gap:16px;flex:1}
.feedback{min-height:44px;text-align:center;font:700 28px var(--display);color:var(--good)}
.feedback.try{color:var(--coral-deep)}

.choices{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.choice{min-width:100px;min-height:100px;border-radius:22px;background:var(--card);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);font:700 44px/1.1 var(--read);padding:10px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.choice .pic{font-size:60px;line-height:1}
.choice .lbl{font-size:24px}
.choice.word{font-size:40px;min-width:150px}
.choice.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 6px 0 var(--good)}
.choice.nope{opacity:.45}
.hint{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 8px rgba(255,197,61,.7)}}
.wobble{animation:wob .4s}
@keyframes wob{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.bigpic{font-size:110px;line-height:1}
.bigword{font:700 64px/1 var(--read);letter-spacing:.04em;background:#FFFBEA;border:3px dashed var(--sun-deep);border-radius:18px;padding:14px 30px}
.bigword .hl{color:var(--coral-deep)}
.eq{font:700 40px var(--read);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.group{display:flex;flex-wrap:wrap;gap:4px;max-width:260px;justify-content:center;font-size:40px;line-height:1;background:#F4FAF8;border-radius:18px;padding:10px}
.gone{opacity:.25;position:relative}
.gone::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:4px;background:var(--coral);transform:rotate(-30deg);border-radius:2px}
.op{font:700 48px var(--display);color:var(--ink-soft)}

/* ten frames */
.frames{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,46px);grid-auto-rows:46px;border:3px solid var(--teal);border-radius:8px;background:var(--teal);gap:3px;overflow:hidden}
.frame span{background:#fff;display:grid;place-items:center;font-size:30px;line-height:1}

/* base-ten */
.rods{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.rod{display:grid;grid-template-rows:repeat(10,20px);gap:2px;background:var(--teal-deep);padding:2px;border-radius:6px}
.rod i,.unit{display:block;width:26px;height:20px;background:var(--sun);border-radius:3px}
.units{display:grid;grid-template-columns:repeat(3,26px);gap:3px;align-content:end}
.unit{box-shadow:0 0 0 2px var(--sun-deep) inset}

/* count & feed */
.tray,.bowl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;border-radius:22px;width:100%;box-sizing:border-box}
.tray{background:#F4FAF8;border:3px dashed var(--line)}
.bowl{background:#FFF3CF;border:4px solid var(--sun-deep);min-height:90px;border-radius:22px 22px 80px 80px}
.tray button,.bowl button{font-size:42px;line-height:1;width:60px;height:60px;border:none;background:none;padding:0}
.count-label{font:700 22px var(--display);color:var(--ink-soft)}

/* jars / compare */
.jar{min-width:150px}
.jar .group{font-size:30px;max-width:180px;background:none;padding:0}
.jar .num{font:700 54px var(--read)}

/* pattern */
.pattern{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:#FDF6E4;border:3px solid #EAD9AE;border-radius:40px;padding:10px 16px}
.pattern span{font-size:44px;line-height:1;width:52px;text-align:center}
.pattern .q{border:3px dashed var(--coral);border-radius:50%;color:var(--coral);font:700 34px/46px var(--display);height:46px}

/* skip count bottles */
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.seq span{min-width:74px;height:96px;border-radius:14px 14px 20px 20px;background:#E8F4FF;border:3px solid #7FB4E0;display:grid;place-items:center;font:700 36px var(--read);position:relative;font-variant-numeric:tabular-nums}
.seq span::before{content:'';position:absolute;top:-12px;width:34px;height:12px;background:#7FB4E0;border-radius:4px 4px 0 0}
.seq .q{background:#FFF3CF;border-color:var(--coral);color:var(--coral)}

/* coins */
.coin{border:none;border-radius:50%;display:grid;place-items:center;align-content:center;gap:0;padding:0;font:700 18px/1 var(--display);color:#3C4650;box-shadow:0 4px 0 rgba(0,0,0,.25), inset 0 0 0 4px rgba(255,255,255,.35)}
.coin .ic{font-size:24px;line-height:1}
.coin.c5{width:76px;height:76px;background:radial-gradient(circle at 35% 30%,#F4F6F8,#B7BFC6)}
.coin.c10{width:64px;height:64px;background:radial-gradient(circle at 35% 30%,#F4F6F8,#AEB6BE);font-size:16px}
.coin.c25{width:88px;height:88px;background:radial-gradient(circle at 35% 30%,#F7F8FA,#A9B2BA)}
.coin.c100{width:92px;height:92px;border-radius:0;background:radial-gradient(circle at 35% 30%,#FFE9A3,#C99A28);clip-path:polygon(50% 0%,77% 8%,95% 29%,100% 56%,89% 80%,65% 97%,35% 97%,11% 80%,0% 56%,5% 29%,23% 8%);box-shadow:none}
.coin.c200{width:98px;height:98px;background:radial-gradient(circle,#E8B84A 0 52%,#C9CFD5 53%);}
.coin.photo{background:none;box-shadow:none;border-radius:50%;clip-path:none}
.coin.photo img{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.coinwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.coinval{font:600 16px var(--display);color:var(--ink-soft)}
.wallet{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}
.pricetag{font:700 40px var(--read);background:var(--card);border:3px solid var(--coral);border-radius:12px 40px 40px 12px;padding:8px 26px 8px 18px;color:var(--coral-deep)}

/* coding grid */
.grid{display:grid;gap:4px;background:#BFE3DA;padding:6px;border-radius:16px}
.grid .cell{width:62px;height:62px;background:#F2FBF8;border-radius:10px;display:grid;place-items:center;font-size:40px;line-height:1;overflow:hidden}
.grid .cell .pet{--s:58px}
.grid .cell .pet .ail{display:none}
.grid .cell .ellie{border-width:2px;box-shadow:0 0 0 2px var(--teal)}
.grid .cell.path{background:#FFF0BF}
.grid .cell.bump{background:#FFD7D0}
.program{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;align-items:center;justify-content:center;background:#F4F0FF;border:3px dashed var(--lilac);border-radius:16px;padding:6px 10px;width:100%;box-sizing:border-box}
.program span{font-size:36px;line-height:1}
.program span.on{outline:3px solid var(--sun-deep);border-radius:8px}
.program .empty{color:var(--ink-soft);font-size:18px}
.arrows{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.arrow{width:72px;height:72px;border-radius:18px;border:3px solid var(--lilac);background:var(--card);font-size:38px;box-shadow:0 5px 0 var(--lilac)}

/* spelling */
.slots{display:flex;gap:10px}
.slot{width:76px;height:88px;border-bottom:6px solid var(--teal);display:grid;place-items:center;font:700 58px var(--read)}
.slot.given{color:var(--ink-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.tile{width:78px;height:78px;border-radius:18px;border:4px solid var(--lilac);background:#F4F0FF;font:700 44px var(--read);box-shadow:0 5px 0 var(--lilac)}
.tile.used{visibility:hidden}

/* syllable drum */
.drum{width:150px;height:150px;border-radius:50%;border:none;background:radial-gradient(circle at 50% 40%,#FFE1A6,#F2A93B);box-shadow:0 10px 0 #B8741B, inset 0 -8px 0 rgba(0,0,0,.08);font:700 26px var(--display);color:#7A4A0F}
.drum.tap{transform:scale(.94)}
.claps{display:flex;gap:10px;min-height:40px}
.claps i{width:34px;height:34px;border-radius:50%;background:var(--coral);display:block}

/* sentence scenes */
.scene{font-size:54px;line-height:1;min-width:170px;min-height:110px;display:flex;align-items:center;justify-content:center;gap:.25em}

/* ---------- healed ---------- */
.healed{flex:1;display:grid;place-items:center;text-align:center;position:relative}
.healed-card{display:flex;flex-direction:column;align-items:center;gap:14px}
.duo{display:flex;align-items:flex-end;gap:10px}
.duo .ellie{margin-bottom:24px}
.healed h2{font-size:clamp(34px,6vw,56px);color:var(--teal-deep)}
.healed p{margin:0;font-size:24px}
.earned{font:700 28px var(--display);color:var(--sun-deep)}
.btnrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-30px;font-style:normal;font-size:30px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* ---------- stickers ---------- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.sticker{background:var(--card);border-radius:24px;border:4px solid var(--line);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.sticker .pet{--s:110px}
.sticker.locked .pet{filter:grayscale(1) brightness(1.6) opacity(.35)}
.sticker b{font-family:var(--display);font-size:20px}
.sticker small{color:var(--ink-soft);font-size:15px}

/* ---------- week edition ---------- */
.week-badge{font:700 20px var(--display);background:var(--sun);color:var(--ink);border-radius:999px;padding:6px 16px;box-shadow:0 4px 0 var(--sun-deep)}
.editions h3{font-size:22px;margin:0 0 8px}
.edition-pick{display:flex;flex-wrap:wrap;gap:12px}
.edition{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:10px 16px;max-width:360px}
.edition b{font:700 19px var(--display)}
.edition small{color:var(--ink-soft);font-size:15px}
.edition.on{border-color:var(--teal);background:#E6F6F3}
.match{display:flex;flex-direction:column;gap:10px;background:#F4FAF8;border-radius:18px;padding:12px 16px}
.matchrow{display:grid;grid-auto-flow:column;grid-auto-columns:46px;gap:4px;font-size:38px;line-height:1;justify-content:start}
.track{display:grid;grid-template-columns:repeat(10,minmax(0,52px));border:3px solid var(--teal);border-radius:10px;overflow:hidden;background:var(--teal);gap:3px;max-width:100%}
.tcell{background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 8px}
.tcell small{font:700 16px var(--read);color:var(--ink-soft)}
.dot{width:30px;height:30px;border-radius:50%;background:#4F5D66;display:block}
.dot.hot{background:var(--coral)}
.dot.empty{background:none;border:2px dashed var(--line)}
.dot.empty.gap{border:3px solid var(--coral);background:#FFE3DE}
.track .tcell:nth-child(5){margin-right:5px}   /* a thicker line after 5 makes "more than 5" easy to see */
/* test practice */
.week-badge.test{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-deep)}
.sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:640px}
.sets .choice.set{min-height:130px;padding:10px}
.sets .group{font-size:30px;max-width:230px;background:none;padding:0}
.choice.set.picked{border-color:var(--sun-deep);background:#FFF3CF;box-shadow:0 6px 0 var(--sun-deep)}
.blank{display:inline-block;min-width:1.2em;padding:0 .2em;border-bottom:5px solid var(--teal);color:var(--coral);text-align:center}
.blank.filled{color:var(--ink)}
.blank.wide{min-width:3em}

<script>
(() => {
'use strict';

/* ================= helpers ================= */
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);
const uniq = a => [...new Set(a)];
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'style') n.style.cssText = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; n.append(c.nodeType ? c : document.createTextNode(c)); }
  return n;
}
const btn = (props, ...kids) => el('button', Object.assign({ type: 'button' }, props), ...kids);

/* ================= saved progress ================= */
const KEY = 'ellies-vet-game-v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const S = Object.assign({ name: 'Ellie', stars: 0, healed: {}, lvl: {}, streak: {}, stats: {}, voice: true, mix: 'both', queue: null,
  owned: [], pets: {}, checkoutMath: true, edition: 'n10' }, load());

/* ================= sound & voice ================= */
let AC = null;
const audio = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
// iPad Safari only lets sound start from a tap, so wake the audio on the first one.
document.addEventListener('pointerdown', () => { try { audio().resume(); } catch (e) {} }, { once: true });
function tone(f, at, dur, type, vol) {
  try {
    audio();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + at;
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  tap() { tone(620, 0, 0.08, 'sine', 0.1); },

};

// The narrator: recorded clips from voice/ (made by tools/voice), one per sentence.
// Any sentence without a clip is read by the device's own voice instead.
const canSpeak = 'speechSynthesis' in window;
let voice = null;
function chooseVoice() {
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  const pref = ['Ava', 'Samantha', 'Karen', 'Moira', 'Tessa', 'Google US English', 'Microsoft Aria', 'Microsoft Jenny'];
  const better = vs.filter(v => /enhanced|premium/i.test(v.name));
  voice = pref.map(p => better.find(v => v.name.includes(p))).find(Boolean) || better[0]
    || pref.map(p => vs.find(v => v.name.includes(p))).find(Boolean) || vs.find(v => /en-(CA|US)/i.test(v.lang)) || vs[0] || null;

const clipKey = t => t.toLowerCase().replace(/’/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
const sentences = t => (String(t).match(/[^.!?]+[.!?]*/g) || []).map(x => x.trim()).filter(x => clipKey(x));
const VOICE = { index: null, packs: [], clips: new Map() };
VOICE.ready = fetch('voice/index.json').then(r => r.ok ? r.json() : null).then(j => {
  if (!j) return;
  VOICE.index = j;
  VOICE.packs = j.packs.map(p => fetch('voice/' + p).then(r => r.arrayBuffer()));
}).catch(() => {});
function clip(k) {
  const hit = VOICE.index && VOICE.index.clips[k];
  if (!hit) return Promise.resolve(null);
  if (!VOICE.clips.has(k)) {
    VOICE.clips.set(k, VOICE.packs[hit[0]].then(buf => new Promise((ok, bad) =>
      audio().decodeAudioData(buf.slice(hit[1], hit[1] + hit[2]), ok, bad))).catch(() => null));
  }
  return VOICE.clips.get(k);
}
let sayId = 0, playing = null;
function playClip(buf, id) {
  return new Promise(done => {
    if (id !== sayId) return done();
    const src = audio().createBufferSource(); src.buffer = buf; src.connect(AC.destination);
    src.onended = () => { if (playing === src) playing = null; done(); };
    playing = src; src.start();
  });

function speakDevice(text, id) {
  return new Promise(done => {
    if (!canSpeak || id !== sayId) return done();
    try {
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice;
      u.rate = 0.88; u.pitch = 1.1; u.onend = u.onerror = () => done();

      setTimeout(done, 1500 + text.length * 120);
    } catch (e) { done(); }

}
function hush() {
  sayId++;
  try { if (playing) playing.stop(); } catch (e) {}

  try { canSpeak && speechSynthesis.cancel(); } catch (e) {}
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
let speaking = Promise.resolve();
async function speak(text, id) {

  await Promise.race([VOICE.ready, sleep(1500)]);
  const bufs = parts.map(p => clip(clipKey(p)));   // start decoding everything at once
  for (let i = 0; i < parts.length; i++) {
    const buf = await bufs[i];
    if (id !== sayId) return;
    if (buf) await playClip(buf, id); else await speakDevice(parts[i], id);

  }

// Say something now, cutting off whatever is being said. Resolves when finished.
function say(text) {

  if (!S.voice || !text) return (speaking = Promise.resolve());
  return (speaking = speak(text, sayId));
}
// Say something after the current line has finished (dropped if something cuts in first).
function sayNext(text) {
  const id = sayId;
  if (!S.voice || !text) return speaking;
  return (speaking = speaking.then(() => sleep(450)).then(() => id === sayId ? speak(text, id) : null));

function numberChoices(ans, spread, min) {
  min = min == null ? 0 : min;
  const opts = new Set([ans]);
  const cands = shuffle(spread.map(d => ans + d).filter(x => x >= min && x !== ans));
  for (const c of cands) { if (opts.size >= 3) break; opts.add(c); }
  for (let k = 1; opts.size < 3; k++) opts.add(ans + k);
  return shuffle([...opts]);
}

const PAW_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16.2" rx="5.2" ry="4.4"/>' +
  '<circle cx="5.6" cy="10" r="2.3"/><circle cx="9.6" cy="6.4" r="2.4"/><circle cx="14.4" cy="6.4" r="2.4"/><circle cx="18.4" cy="10" r="2.3"/></svg>';
function tenFrames(n, icon) {
  const wrap = el('div', { class: 'frames' });
  const frames = Math.max(1, Math.ceil(n / 10));
  for (let f = 0; f < frames; f++) {
    const fr = el('div', { class: 'frame' });
    for (let i = 0; i < 10; i++) {
      const full = f * 10 + i < n;
      fr.append(icon === 'paw' ? el('span', { class: 'paw', html: full ? PAW_SVG : '' }) : el('span', null, full ? icon : ''));
    }
    wrap.append(fr);
  }
  return wrap;
}
function iconGroup(n, icon, goneFrom) {
  const g = el('div', { class: 'group' });
  for (let i = 0; i < n; i++) g.append(el('span', { class: goneFrom != null && i >= goneFrom ? 'gone' : null }, icon));
  return g;
}

const PRAISE = ['Great job!', 'You did it!', 'Super!', 'Wow, well done!', 'Yes! That is right!', 'Amazing, Doctor!'];
const OOPS = ['Almost! Try again.', 'Good try! Have another go.', 'Oops! Try again.', 'Not quite. You can do it!'];

function choiceRow(box, opts, api, cls) {
  const row = el('div', { class: 'choices' });
  const buttons = opts.map(o => {
    const b = btn({ class: 'choice ' + (cls || ''), 'aria-label': o.aria || null, onclick: () => {
      if (b.classList.contains('right')) return;
      if (o.ok) { b.classList.add('right'); api.win(o.after); } else { b.classList.add('nope'); api.miss(b); }
    } }, o.node || o.label);
    return b;
  });
  row.append(...buttons); box.append(row);
  return () => buttons.forEach((b, i) => opts[i].ok && b.classList.add('hint'));
}

  code: { area: 'math', label: 'Coding', curric: 'Algebra – coding with step-by-step instructions', make(l, a) {
    const W = 5, H = 4;
    let start, goal, blocks = [];
    const key = (x, y) => x + ',' + y;
    function path(bl) {
      const bset = new Set(bl.map(b => key(b[0], b[1])));
      const q = [[start, []]], seen = new Set([key(...start)]);
      while (q.length) {
        const [[x, y], p] = q.shift();
        if (x === goal[0] && y === goal[1]) return p;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy, k = key(nx, ny);
          if (nx < 0 || ny < 0 || nx >= W || ny >= H || bset.has(k) || seen.has(k)) continue;
          seen.add(k); q.push([[nx, ny], p.concat([[nx, ny]])]);
        }
      }
      return null;
    }
    for (let tries = 0; tries < 200; tries++) {
      start = [rnd(0, W - 1), rnd(0, H - 1)];
      if (l === 1) { goal = Math.random() < 0.5 ? [rnd(0, W - 1), start[1]] : [start[0], rnd(0, H - 1)]; }
      else goal = [rnd(0, W - 1), rnd(0, H - 1)];
      const d = Math.abs(goal[0] - start[0]) + Math.abs(goal[1] - start[1]);
      if (d < 2 || d > (l === 1 ? 4 : 6)) continue;
      if (l === 2 && (goal[0] === start[0] || goal[1] === start[1])) continue;
      blocks = [];
      if (l === 3) {
        const free = [];
        for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) if (!(x === start[0] && y === start[1]) && !(x === goal[0] && y === goal[1])) free.push([x, y]);
        blocks = sample(free, rnd(2, 3));
      }
      const p = path(blocks);
      if (p && (l < 3 || p.length > d || blocks.some(b => (b[0] === start[0] || b[1] === start[1]))) && p.length <= 7) break;
    }
    if (!path(blocks)) blocks = [];
    const best = path(blocks) || [];
    return {
      prompt: 'Help Dr. ' + S.name + ' walk to ' + a.name + '! Make a plan with the arrows, then press Go.',
      speak: 'Help Doctor ' + S.name + ' walk to ' + a.name + '. Tap the arrows to make a plan, then press go.',
      build(box, api) {
        const grid = el('div', { class: 'grid', style: 'grid-template-columns:repeat(' + W + ',auto)' });
        const cells = {};
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const c = el('div', { class: 'cell' }); cells[key(x, y)] = c; grid.append(c); }
        blocks.forEach(b => { cells[key(...b)].textContent = pick(['🪴', '📦']); });
        cells[key(...goal)].append(pet(a, 58));
        const doc = ellie(50);
        let pos = start.slice(), running = false;
        const place = () => cells[key(...pos)].append(doc);
        place();
        const prog = [], progEl = el('div', { class: 'program', 'aria-label': 'your plan' });
        const ARROWS = { up: ['⬆️', 0, -1], right: ['➡️', 1, 0], down: ['⬇️', 0, 1], left: ['⬅️', -1, 0] };
        const drawProg = hi => { progEl.replaceChildren(...(prog.length ? prog.map((d, i) => el('span', { class: i === hi ? 'on' : null }, ARROWS[d][0])) : [el('span', { class: 'empty' }, 'Your plan goes here')])); };
        drawProg();
        const arrows = el('div', { class: 'arrows' },
          ['left', 'up', 'down', 'right'].map(d => btn({ class: 'arrow', 'aria-label': d, onclick: () => { if (running || prog.length >= 12) return; sfx.tap(); prog.push(d); drawProg(); } }, ARROWS[d][0])),
          btn({ class: 'arrow', 'aria-label': 'undo', onclick: () => { if (running) return; prog.pop(); drawProg(); } }, '↩️'));
        const go = btn({ class: 'big teal small', onclick: run }, 'Go ▶');
        function reset() { pos = start.slice(); place(); Object.values(cells).forEach(c => c.classList.remove('bump')); running = false; drawProg(); }
        function run() {
          if (running || !prog.length) return;
          running = true; pos = start.slice(); place();
          let i = 0;
          const stepFn = () => {
            if (i >= prog.length) {
              if (pos[0] === goal[0] && pos[1] === goal[1]) { api.win('You made it to ' + a.name + '!'); }
              else { api.miss(grid, 'Not there yet. Fix your plan and try again!'); setTimeout(reset, 900); }
              return;
            }
            drawProg(i);
            const [, dx, dy] = ARROWS[prog[i]];
            const nx = pos[0] + dx, ny = pos[1] + dy;
            const blocked = nx < 0 || ny < 0 || nx >= W || ny >= H || blocks.some(b => b[0] === nx && b[1] === ny);
            if (blocked) {
              const c = cells[key(nx, ny)]; if (c) c.classList.add('bump');
              api.miss(grid, 'Bonk! Something is in the way.'); setTimeout(reset, 1100); return;
            }
            pos = [nx, ny]; place(); sfx.tap(); i++;
            setTimeout(stepFn, 480);
          };
          setTimeout(stepFn, 250);
        }
        box.append(grid, progEl, arrows, go);
        return () => best.forEach(p => cells[key(...p)].classList.add('path'));
      },
    };
  } },

/* ================= week edition: Numbers to 10 =================
   Made from Ellie's Chapter 1 worksheets (Online Workbook 1A / Revisit 1A):
   counting to 10 in numbers and words, comparing (more / fewer / same, greater / less than),
   counting on and back, 1-4 more or less, "how many more", ten frames and ordering towers.
   Every number stays within 0-10. */
const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const N10_THINGS = [['🩹', 'bandages'], ['💊', 'vitamins'], ['🦴', 'chew toys'], ['🧸', 'toys']];
const N10_PAIRS = [[['🦴', 'bones'], ['🐶', 'puppies']], [['🥕', 'carrots'], ['🐰', 'bunnies']], [['🐟', 'fish'], ['🐱', 'kittens']],
  [['🪱', 'worms'], ['🐦', 'birds']], [['🥣', 'bowls'], ['🐹', 'hamsters']]];
const upto = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };
// three answer choices near the answer, all within lo..hi
function near(ans, lo, hi) {
  lo = lo == null ? 0 : lo; hi = hi == null ? 10 : hi;
  const c = shuffle([1, -1, 2, -2, 3, -3].map(d => ans + d).filter(x => x >= lo && x <= hi));
  return shuffle([ans, c[0], c[1]]);
}
// the worksheet's number track: cells 1-10, counters up to n, the ones above `from` highlighted
function track(n, from) {
  return el('div', { class: 'track', 'aria-hidden': 'true' }, upto(1, 10).map(i =>
    el('div', { class: 'tcell' }, el('small', null, String(i)), el('span', { class: 'dot' + (i > n ? ' empty' : from != null && i > from ? ' hot' : '') }))));
}
const N10 = {
  n10count: { area: 'math', label: 'Counting to 10', curric: 'Numbers to 10 – counting objects 0 to 10', make(l) {
    const n = l === 1 ? rnd(1, 5) : l === 2 ? rnd(1, 10) : rnd(0, 10);
    const [ic, thing] = pick(N10_THINGS);
    return {
      prompt: 'How many ' + thing + ' are in the box?', speak: 'How many ' + thing + ' are in the box?',
      build(box, api) {
        box.append(tenFrames(n, ic));
        return choiceRow(box, near(n).map(x => ({ label: String(x), ok: x === n, after: 'Yes, ' + n + ' ' + thing + '!' })), api);
      },
    };
  } },

  n10compare: { area: 'math', label: 'More, fewer, same', curric: 'Numbers to 10 – comparing: more, fewer, same, greater than, less than', make(l) {
    if (l >= 2 && Math.random() < 0.4) {
      const greater = Math.random() < 0.5, k = greater ? rnd(0, 8) : rnd(2, 10);
      const ok = greater ? rnd(k + 1, 10) : rnd(0, k - 1);
      const wrong = sample(upto(0, 10).filter(x => greater ? x <= k : x >= k), 2);
      const rel = greater ? ' is greater than ' : ' is less than ';
      return {
        prompt: '__' + rel + k + '.', speak: 'Which number is ' + (greater ? 'greater' : 'less') + ' than ' + k + '?',
        build(box, api) {
          box.append(el('div', { class: 'bigword' }, el('span', { class: 'hl' }, '?'), rel + k));
          return choiceRow(box, shuffle([ok, ...wrong]).map(x => ({ label: String(x), ok: x === ok, after: ok + rel + k + '!' })), api);
        },
      };
    }
    const [[ia, na], [ib, nb]] = pick(N10_PAIRS), max = l === 1 ? 5 : 10;
    const a = rnd(1, max);
    let b = a;
    if (Math.random() >= (l === 3 ? 0.35 : 0.2)) { do { b = rnd(1, max); } while (b === a || (l === 1 && Math.abs(a - b) < 2)); }
    const q = pick(['more', 'fewer', 'same']);
    const truth = q === 'more' ? a > b : q === 'fewer' ? a < b : a === b;
    const prompt = q === 'same' ? 'Is the number of ' + na + ' and ' + nb + ' the same?' : 'Are there ' + q + ' ' + na + ' than ' + nb + '?';
    const why = a === b ? a + ' and ' + b + ' are the same!' : a > b ? a + ' is more than ' + b + '!' : a + ' is less than ' + b + '!';
    return {
      prompt, speak: prompt,
      build(box, api) {
        const row = (n, ic) => el('div', { class: 'matchrow' }, upto(1, n).map(() => el('span', null, ic)));
        box.append(el('div', { class: 'match' }, row(a, ia), row(b, ib)));
        return choiceRow(box, ['Yes', 'No'].map(w => ({ label: w, ok: (w === 'Yes') === truth, after: (truth ? 'Yes! ' : 'No! ') + why })), api, 'word');
      },
    };
  } },

  n10next: { area: 'math', label: 'What comes next?', curric: 'Numbers to 10 – counting on and back, missing numbers', make(l) {
    const down = l > 1 && Math.random() < 0.5, start = rnd(0, 6);
    const seq = upto(start, start + 4); if (down) seq.reverse();
    const hole = l === 3 ? rnd(0, 4) : 4, ans = seq[hole];

  ['Is a frog a dog?', false], ['Can he jog?', true], ['Can a frog sit on a log?', true], ['Can a dog sit in a box?', true],

const O_SCENE_PLACES = [['box', '📦'], ['log', '🪵']];
// The UFLI word-work instruction for one step of a chain ("Change the t to g.")
function chainStep(a, b) {
  if (a.length === b.length) { const i = [...a].findIndex((c, k) => c !== b[k]); return 'Change the ' + a[i] + ' to ' + b[i] + '.'; }
  if (b.length === a.length + 1) {
    const i = [...b].findIndex((c, k) => b.slice(0, k) + b.slice(k + 1) === a);
    return i === 0 ? 'Add ' + b[0] + ' to the start.' : i === b.length - 1 ? 'Add ' + b[i] + ' to the end.' : 'Add ' + b[i] + ' after the ' + b[i - 1] + '.';
  }
  const i = [...a].findIndex((c, k) => a.slice(0, k) + a.slice(k + 1) === b);
  return 'Take away the ' + a[i] + '.';
}

function newPatient(exclude) {
  const healedCount = id => S.healed[id] || 0;
  const pool = ANIMALS.filter(a => !exclude.includes(a.id));
  const minH = Math.min(...pool.map(a => healedCount(a.id)));
  const fresh = pool.filter(a => healedCount(a.id) === minH);
  return { a: pick(fresh).id, ail: pick(AILMENTS).id };
}
function ensureQueue() {
  if (!Array.isArray(S.queue) || S.queue.length !== 3 || S.queue.some(p => !A(p.a) || !AIL(p.ail))) {

    save();
  }
}

    }))));

function planSkills() {
  const w = edition().weights;
  if (w) {
    // Weighted picks: the first step is always a "more than 5 / less than 10" style question.
    const draw = pool => { let r = Math.random() * pool.reduce((s, k) => s + w[k], 0); return pool.find(k => (r -= w[k]) < 0) || pool[0]; };
    const first = draw(['t1five', 'n10moreless'].filter(k => w[k]));
    const plan = [first];
    while (plan.length < 3) plan.push(draw(Object.keys(w).filter(k => !plan.includes(k) && !(ALL_SKILLS[k].needsVoice && !canSpeak))));
    return plan;
  }
  const mathOn = S.mix !== 'lang', langOn = S.mix !== 'math';
  let order;
  if (mathOn && langOn) order = Math.random() < 0.5 ? ['math', 'lang', 'math'] : ['lang', 'math', 'lang'];
  else order = [mathOn ? 'math' : 'lang', mathOn ? 'math' : 'lang', mathOn ? 'math' : 'lang'];
  const used = [];
  return order.map(area => {
    const pool = areaSkills(area).filter(k => !used.includes(k));
    // lean towards skills practiced least so everything gets a turn
    const least = Math.min(...pool.map(k => (S.stats[k] || { done: 0 }).done));
    const choice = pick(pool.filter(k => (S.stats[k] || { done: 0 }).done <= least + 1));
    used.push(choice); return choice;
  });
}

function record(skill, misses) {
  const st = S.stats[skill] || (S.stats[skill] = { done: 0, first: 0 });
  st.done++; if (!misses) st.first++;
  const lv = levelOf(skill);
  let up = false;
  if (!misses) {
    S.streak[skill] = (S.streak[skill] || 0) + 1;
    if (S.streak[skill] >= 3 && lv < 3) { S.lvl[skill] = lv + 1; S.streak[skill] = 0; up = true; }
  } else {
    S.streak[skill] = 0;
    if (misses >= 3 && lv > 1) S.lvl[skill] = lv - 1;
  }
  return up;
}

      el('td', { class: 'n' }, st.done ? Math.round(100 * st.first / st.done) + '%' : '–'));
  });
  screen(el('main', { class: 'screen' }, el('section', { class: 'parent' },
    el('h2', null, 'Grown-ups corner'),
    Date.now() < TEST_UNTIL ? el('div', { class: 'editions' }, el('h3', null, '📝 Chapter 1 test practice'),
      el('p', null, EDITIONS.test1.note + ' While it is on, it replaces the edition below.'),
      el('div', { class: 'settings' }, el('span', null, 'Test practice'),
        el('div', { class: 'seg', role: 'group' }, [[false, 'On'], [true, 'Off']].map(([v, lab]) =>
          btn({ class: !!S.testOff === v ? 'on' : null, onclick: () => { S.testOff = v; save(); showParent(); } }, lab))))) : null,
    el('div', { class: 'editions' }, el('h3', null, 'Edition'),
      el('div', { class: 'edition-pick' }, Object.entries(EDITIONS).filter(([, ed]) => !ed.temporary).map(([id, ed]) => {
        const on = (EDITIONS[S.edition] || EDITIONS.base) === ed;
        return btn({ class: 'edition' + (on ? ' on' : ''), onclick: () => { S.edition = id; save(); showParent(); } },
          el('b', null, (on ? '✓ ' : '') + ed.name), el('small', null, ed.note));
      }))),
    el('p', null, 'The skill table below shows the activities in the edition you picked. Stars, stickers, decorations and pets are shared by all editions.'),
    el('p', null, 'Every patient needs three treatment steps. Each step is a short activity from the Ontario Grade 1 Mathematics (2020) and Language (2023) curriculum. Levels go up by themselves after three first-try answers in a row, and go down after a struggle. You can also set them by hand below.'),
    el('div', { class: 'settings' },
      el('label', { for: 'kid-name' }, 'Name', nameIn),
      el('span', null, 'Voice'), seg([[true, 'On'], [false, 'Off']], S.voice, v => { S.voice = v; }),
      el('span', null, 'Subjects'), seg([['both', 'Math + Reading'], ['math', 'Math only'], ['lang', 'Reading only']], S.mix, v => { S.mix = v; }),
      el('span', null, 'Shop checkout'), seg([[true, 'Count star bags'], [false, 'One-tap buy']], S.checkoutMath, v => { S.checkoutMath = v; })),
    el('p', null, 'Stars (5 per patient) are spent in the clinic shop, on decorations and on adopting animals ' + S.name + ' has already helped. With "Count star bags", she pays by tapping 10-star and 5-star bags while the narrator counts along. Adopted pets never get sick or sad; after a couple of days away they just say they missed her.'),
    el('p', null, 'Stars now: ' + S.stars + ' · Decorations: ' + S.owned.length + ' of ' + DECOR.length + ' · Pets adopted: ' + Object.keys(S.pets).length),
    !canSpeak ? el('p', null, 'This browser cannot read aloud, so the "find the word you hear" activity is turned off.') : null,
    el('div', { class: 'tablewrap' }, el('table', null,
      el('thead', null, el('tr', null, ['Subject', 'Skill', 'Level', 'Done', 'First try'].map(h => el('th', null, h)))),
      el('tbody', null, rows))),
    el('p', null, 'Level guide for number work: level 1 uses numbers to 10, level 2 to 20, level 3 to 50. Skip counting goes 10s → 5s → 2s. Coins go from naming coins to paying with nickels and dimes, then quarters.'),
    el('h3', { style: 'font-size:22px' }, 'Photo credits'),
    el('p', null, 'Animal photos are from Wikimedia Commons, with backgrounds removed. Tap a name to see the original photo.'),
    el('ul', { class: 'credits' }, PHOTO_CREDITS.filter(c => photoOK[c[0]]).map(([id, who, lic, url]) =>
      el('li', null, el('a', { href: url, target: '_blank', rel: 'noopener' }, A(id).name + ' the ' + A(id).kind), ' · ' + who + ' · ' + lic))),
    el('div', { class: 'btnrow', style: 'justify-content:flex-start' }, btn({ class: 'big teal small', onclick: showTitle }, 'Done'), reset))));
}

showTitle();
})();
</script>
